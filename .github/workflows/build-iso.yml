name: Build TizenOS Live ISO & Debian Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build TizenOS ISO & Packages
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Build Dependencies & Tools
        run: |
          chmod +x build/scripts/install-build-deps.sh
          ./build/scripts/install-build-deps.sh --full

      - name: 3. Build C Core System & Debian Packages (.deb)
        run: |
          mkdir -p build/output/debs
          chmod +x build/scripts/build-packages.sh
          ./build/scripts/build-packages.sh --no-sign || true

      - name: 4. Generate Local APT Repository
        run: |
          chmod +x build/scripts/create-repo.sh
          ./build/scripts/create-repo.sh || true

      - name: 5. Compute SHA256/SHA512 Checksums & Signatures
        run: |
          chmod +x build/scripts/create-checksums.sh
          ./build/scripts/create-checksums.sh build/output

      - name: 6. Build Master Hybrid Live ISO (UEFI + MBR)
        run: |
          chmod +x build/scripts/create-iso.sh
          ./build/scripts/create-iso.sh build/output/iso_work build/output/tizenos-live.iso

      - name: 7. Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: tizenos-live-iso-v1.0.0
          path: |
            build/output/tizenos-live.iso
            build/output/SHA256SUMS
            build/output/SHA512SUMS
            build/output/MD5SUMS

      - name: 8. Publish Release on GitHub (Tag Triggered)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/output/tizenos-live.iso
            build/output/SHA256SUMS
            build/output/SHA512SUMS
            build/output/MD5SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
