# ==============================================================================
# TizenOS MBR / BIOS GRUB Bootloader Configuration
# ==============================================================================

set timeout=10
set default=0

# Video drivers for Legacy BIOS
insmod vbe
insmod vga
insmod font
insmod png
insmod gfxmenu

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=1920x1080,1024x768,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# Load TizenOS Modern Theme
set theme=/boot/grub/themes/tizenos/theme.txt
export theme

# Menu Entries
menuentry "TizenOS Live Desktop (Wayland Native)" --class tizenos {
    set gfxpayload=keep
    echo "Loading TizenOS Linux Kernel..."
    linux /live/vmlinuz boot=live quiet splash loglevel=3 rw tizenos.session=wayland
    initrd /live/initrd.img
}

menuentry "TizenOS Safe Graphics (X11 Fallback)" --class safe {
    set gfxpayload=keep
    echo "Loading TizenOS Kernel (Safe Graphics Mode)..."
    linux /live/vmlinuz boot=live nomodeset quiet splash rw tizenos.session=x11
    initrd /live/initrd.img
}

menuentry "Install TizenOS to Hard Disk" --class installer {
    set gfxpayload=keep
    echo "Launching TizenOS Graphical Installer..."
    linux /live/vmlinuz boot=live quiet splash rw live-installer
    initrd /live/initrd.img
}

menuentry "Memory Diagnostics (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}

menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off Computer" --class shutdown {
    halt
}
