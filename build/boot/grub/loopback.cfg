menuentry "TizenOS Live (Wayland) [Loopback]" {
    linux /live/vmlinuz boot=live findiso=${iso_path} quiet splash loglevel=3 rw
    initrd /live/initrd.img
}

menuentry "TizenOS Safe Graphics (X11 Fallback) [Loopback]" {
    linux /live/vmlinuz boot=live findiso=${iso_path} nomodeset quiet splash rw
    initrd /live/initrd.img
}
