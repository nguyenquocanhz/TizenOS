UI vesamenu.c32
PROMPT 0
TIMEOUT 50
DEFAULT live
DISPLAY isolinux.msg

MENU TITLE TizenOS Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border 30;44 #40ffffff #a0000000 std
MENU COLOR title 1;36;44 #ffffffff #a0000000 std
MENU COLOR sel 7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel 37;44 #50ffffff #a0000000 std
MENU COLOR help 37;40 #c0ffffff #a0000000 std
MENU COLOR timeout_msg 37;40 #80ffffff #00000000 std
MENU COLOR timeout 1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07 37;40 #90ffffff #a0000000 std
MENU COLOR tabmsg 31;40 #ffDEDEDE #00000000 std

LABEL live
  MENU LABEL ^TizenOS Live (Wayland)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live quiet splash loglevel=3 rw

LABEL safe
  MENU LABEL TizenOS ^Safe Graphics (X11 Fallback)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live nomodeset quiet splash rw

LABEL install
  MENU LABEL TizenOS ^Installer
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live quiet splash rw live-installer

LABEL memtest
  MENU LABEL ^Memory Test
  KERNEL /boot/memtest86+.bin
