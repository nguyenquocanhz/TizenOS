<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root or security-manager user can own Security Manager D-Bus service -->
  <policy user="root">
    <allow own="org.tizen.security.manager"/>
    <allow send_destination="org.tizen.security.manager"/>
  </policy>

  <!-- Any logged in user can call security manager methods -->
  <policy context="default">
    <allow send_destination="org.tizen.security.manager"/>
  </policy>
</busconfig>
