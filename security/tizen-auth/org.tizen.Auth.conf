<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root or tizen-auth daemon can own org.tizen.Auth service -->
  <policy user="root">
    <allow own="org.tizen.Auth"/>
    <allow send_destination="org.tizen.Auth"/>
  </policy>

  <!-- Any logged in user can request authentication or consent prompt -->
  <policy context="default">
    <allow send_destination="org.tizen.Auth"/>
  </policy>
</busconfig>
