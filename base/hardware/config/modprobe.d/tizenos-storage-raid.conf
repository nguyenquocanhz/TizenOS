# Cấu hình modprobe cho hệ thống lưu trữ TizenOS
# Bao gồm NVMe, Intel VMD, mdadm RAID, và libata

# Bật NVMe Multipathing (Cho các SSD hỗ trợ đường dẫn kép hoặc enterprise SSD)
options nvme_core multipath=Y

# Điều chỉnh trạng thái tiết kiệm điện năng cho NVMe (Giảm độ trễ)
options nvme_core default_ps_max_latency_us=5500

# Tự động tải module Intel VMD cho các cấu trúc RAID tích hợp NVMe của Intel
alias pci:v00008086d*sv*sd*bc01sc04i00* vmd

# Đảm bảo libata cho phép TRIM liên tục cho SSD SATA (nếu có)
options libata allow_tpm=1
options libata dma=1

# Tối ưu hóa loop device để hỗ trợ thiết lập phân vùng
options loop max_part=15
