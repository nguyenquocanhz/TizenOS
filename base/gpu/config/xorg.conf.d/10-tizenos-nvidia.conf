# TizenOS X11 Fallback - NVIDIA Configuration
# =============================================================================
# Cấu hình Xorg cho NVIDIA khi Wayland không khả dụng (driver < 495)
# =============================================================================

Section "OutputClass"
    Identifier     "tizenos-nvidia"
    MatchDriver    "nvidia-drm"
    Driver         "nvidia"

    # DRI3: cần cho Vulkan và better buffer management
    Option         "DRI3"             "true"

    # Primary GPU trong PRIME setup
    Option         "PrimaryGPU"       "yes"

    # PRIME Sync: giảm tearing khi PRIME offloading
    Option         "AllowPRIMEDisplayOffloadSink" "true"

    # Triple buffer: giảm stutter (tốn thêm VRAM)
    Option         "TripleBuffer"     "true"

    # Coolbits: cho phép overclock qua nvidia-settings (tùy chọn)
    # Bit 0 (1): Overclocking
    # Bit 1 (2): Thermal monitoring
    # Bit 2 (4): Manual fan control
    # Bit 3 (8): Overvolt
    # Option       "Coolbits"        "28"

    # Metamodes cho multi-monitor
    # Option       "MetaModes"       "nvidia-auto-select +0+0"
EndSection

Section "ServerFlags"
    # Tắt GPU cũ nếu PRIME (tiết kiệm pin)
    # Option       "AutoAddGPU"      "false"
    # Option       "AutoBindGPU"     "false"
EndSection
