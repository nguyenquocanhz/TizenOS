# TizenOS X11 Fallback - Modesetting Configuration
# =============================================================================
# Cấu hình Xorg cho AMD/Intel/generic khi Wayland không khả dụng
# Sử dụng modesetting driver (universal, DRM/KMS native)
# =============================================================================

Section "OutputClass"
    Identifier     "tizenos-modesetting"
    MatchDriver    "amdgpu|i915|radeon|nouveau|simpledrm|virtio"
    Driver         "modesetting"

    # DRI3: required cho Vulkan và Mesa performance
    Option         "DRI3"          "true"

    # TearFree: tránh screen tearing (hardware vsync)
    # Tốn thêm ~10% GPU, nhưng trải nghiệm mượt hơn nhiều
    Option         "TearFree"      "true"

    # Acceleration method: glamor (OpenGL-based, universal)
    Option         "AccelMethod"   "glamor"

    # Page flipping: giảm latency
    Option         "PageFlip"      "true"
EndSection

# Virtual GPU (QEMU/VirtualBox) — sử dụng modesetting đơn giản
Section "OutputClass"
    Identifier     "tizenos-virtual"
    MatchDriver    "qxl|vmwgfx|virtio_gpu|bochs|vboxvideo"
    Driver         "modesetting"

    Option         "DRI3"          "true"
    Option         "AccelMethod"   "glamor"
EndSection
