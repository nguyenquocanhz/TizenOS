# TizenOS: Chặn nouveau để sử dụng NVIDIA proprietary driver
# =============================================================================
# Xung đột: nouveau và nvidia kernel modules KHÔNG THỂ load cùng lúc.
# Khi nvidia proprietary được cài, nouveau phải bị blacklist hoàn toàn.
# =============================================================================

# Chặn nouveau hoàn toàn
blacklist nouveau
blacklist lbm-nouveau
options nouveau modeset=0
alias nouveau off

# Tải nvidia modules theo đúng thứ tự dependency
# nvidia → nvidia-modeset → nvidia-drm
softdep nvidia post: nvidia-modeset nvidia-uvm
softdep nvidia-modeset post: nvidia-drm

# Bắt buộc cho Wayland: kích hoạt DRM kernel modesetting
options nvidia-drm modeset=1 fbdev=1

# Giữ VRAM allocations khi suspend/resume (tránh black screen sau resume)
options nvidia NVreg_PreserveVideoMemoryAllocations=1

# Bật dynamic power management cho Turing+ GPU (RTX 20xx trở lên)
# Giúp tiết kiệm pin trên laptop hybrid GPU
options nvidia NVreg_DynamicPowerManagement=0x02
